services:
    app:
        image: ${DOCKER_IMAGE:-ghcr.io/adisufatulanam/d-fiber}:${DOCKER_IMAGE_TAG:-latest}
        container_name: ${DOCKER_APP_CONTAINER:-dfiber-app}
        restart: unless-stopped
        ports:
            - '${DOCKER_HTTP_PORT:-8000}:80'
        env_file:
            - .env
        volumes:
            - app-storage:/var/www/html/storage
        environment:
            - DB_CONNECTION=${DB_CONNECTION:-mysql}
            - DB_HOST=${DB_HOST:-host.docker.internal}
            - DB_PORT=${DB_PORT:-3306}
            - DB_DATABASE=${DB_DATABASE:-dfiber}
            - DB_USERNAME=${DB_USERNAME:-root}
            - DB_PASSWORD=${DB_PASSWORD:-}
            - PAIL_DISABLED=true
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - dfiber-network

    queue:
        image: ${DOCKER_IMAGE:-ghcr.io/adisufatulanam/d-fiber}:${DOCKER_IMAGE_TAG:-latest}
        container_name: ${DOCKER_QUEUE_CONTAINER:-dfiber-queue}
        restart: unless-stopped
        command: php artisan queue:work --sleep=3 --tries=5 --timeout=120
        env_file:
            - .env
        volumes:
            - app-storage:/var/www/html/storage
        environment:
            - DB_CONNECTION=${DB_CONNECTION:-mysql}
            - DB_HOST=${DB_HOST:-host.docker.internal}
            - DB_PORT=${DB_PORT:-3306}
            - DB_DATABASE=${DB_DATABASE:-dfiber}
            - DB_USERNAME=${DB_USERNAME:-root}
            - DB_PASSWORD=${DB_PASSWORD:-}
            - PAIL_DISABLED=true
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        networks:
            - dfiber-network

volumes:
    app-storage:

networks:
    dfiber-network:
        name: ${DOCKER_NETWORK_NAME:-dfiber-network}
        driver: bridge
