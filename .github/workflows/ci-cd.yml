name: CI/CD

on:
  push:
    branches:
      - main
      - dev 
  pull_request: 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: "Job 1/3: Test"
    runs-on: ubuntu-latest 
    timeout-minutes: 20 
    permissions:
      contents: read 

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_ROOT_HOST: "%" 
          MYSQL_DATABASE: dfiber
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 
        with:
          php-version: '8.5'
          extensions: pdo_mysql 
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  build:
    name: "Job 2/3: Build image"
    needs: test 
    runs-on: ubuntu-latest
    timeout-minutes: 30 

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
        with:
          persist-credentials: false

      - name: Login ke GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 
        with:
          registry: ghcr.io 
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Hitung metadata image
        id: meta 
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 
        with:
          images: ghcr.io/${{ github.repository }} 
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build dan push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: . 
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha 
          cache-to: type=gha,mode=max 

    outputs:
      image: ${{ steps.meta.outputs.image }} 
      tag: ${{ steps.meta.outputs.version }} 

  deploy:
    name: "Job 3/3: Deploy"
    needs: build 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 
        with:
          persist-credentials: false

      - name: Hubungkan runner ke Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Upload docker-compose.prod.yml ke server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }} # isi private key 
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }} # IP Tailscale server
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }} # username SSH di server
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }} # direktori deploy, mis. /home/dfiber
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/id_ed25519"

          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Jalankan deploy di server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 
        env:
          DOCKER_IMAGE: ${{ needs.build.outputs.image }} 
          DOCKER_IMAGE_TAG: ${{ needs.build.outputs.tag }} 
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }} 
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 2m 
          command_timeout: 20m 
          envs: DOCKER_IMAGE,DOCKER_IMAGE_TAG,DEPLOY_PATH
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            echo "==> [1/6] Tarik image ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG} dari GHCR"

            docker compose -f docker-compose.prod.yml pull

            echo "==> [2/6] Jalankan ulang container dengan image baru"

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> [3/6] Jalankan migrasi database"

            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "==> [4/6] Cache konfigurasi & route"

            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize

            echo "==> [5/6] Smoke test: buka halaman utama dari dalam container"

            smoke_ok=""
            for i in $(seq 1 10); do
              if docker compose -f docker-compose.prod.yml exec -T app curl -fsS -o /dev/null http://localhost/; then
                smoke_ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$smoke_ok" ]; then
              echo "Smoke test GAGAL: aplikasi tidak merespons"
              docker compose -f docker-compose.prod.yml logs --tail=50 app
              exit 1
            fi
            echo "      OK - aplikasi merespons 200"

            echo "==> [6/6] Status container + bersihkan image lama"

            docker compose -f docker-compose.prod.yml ps

            docker image prune -f

  notify:
    name: "Notifikasi Discord"
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Notifikasi Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WEBHOOK_URL tidak diset, lewati notifikasi."
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            EMOJI="🚀"
            STATUS="SUCCESS"
            COLOR=3066993
            FOOTER="🎉 Application successfully deployed!"
          else
            EMOJI="💥"
            STATUS="FAILED"
            COLOR=15158332
            FOOTER="❌ Deployment failed. Check GitHub Actions logs!"
          fi

          FMT_TEST=$( [ "$TEST_RESULT" = "success" ] && echo "SUCCESS" || echo "FAILED" )
          FMT_BUILD=$( [ "$BUILD_RESULT" = "success" ] && echo "SUCCESS" || ( [ "$BUILD_RESULT" = "skipped" ] && echo "SKIPPED" || echo "FAILED" ) )
          FMT_DEPLOY=$( [ "$DEPLOY_RESULT" = "success" ] && echo "SUCCESS" || ( [ "$DEPLOY_RESULT" = "skipped" ] && echo "SKIPPED" || echo "FAILED" ) )

          PAYLOAD=$(jq -n \
            --arg title "${EMOJI} CI/CD DEPLOYMENT ${STATUS}" \
            --arg repo "${{ github.repository }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg author "${{ github.actor }}" \
            --arg commit "${{ github.sha }}" \
            --arg test "$FMT_TEST" \
            --arg build "$FMT_BUILD" \
            --arg deploy "$FMT_DEPLOY" \
            --arg footer "$FOOTER" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: ("```\n📦 Project : dfiber-app\n🌿 Branch  : " + $branch + "\n👤 Author  : " + $author + "\n🔖 Commit  : " + $commit + "\n\n📋 PIPELINE RESULTS\n━━━━━━━━━━━━━━━━━━━━\nTest Check    : " + $test + "\nDocker Build  : " + $build + "\nSSH Deploy    : " + $deploy + "\n━━━━━━━━━━━━━━━━━━━━\n\n" + $footer + "\n\n🔗 GitHub Actions:\nhttps://github.com/" + $repo + "/actions/runs/" + $run_id + "\n```"),
                color: $color
              }]
            }')

          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "${WEBHOOK_URL}"

