# =============================================================================
# CI/CD: Test -> Build Image (GHCR) -> Deploy ke Server Home (Tailscale SSH)
# =============================================================================
# Alur pipeline (3 job, berurutan):
#   1. test   : lint (Pint), type-check (PHPStan + vue-tsc), unit test (Pest)
#   2. build  : build Docker image lalu push ke GitHub Container Registry
#   3. deploy : SSH ke server home lewat Tailscale -> pull image -> migrate -> optimize
#
# Deploy HANYA berjalan saat push ke branch main.
# Panduan lengkap setup GitHub & server home: docs/panduan-ci-cd.md
# =============================================================================

name: CI/CD

on:
  push:
    branches:
      - main # branch produksi -> test + build + deploy
      - dev # branch pengembangan -> test + build saja (tanpa deploy)
  pull_request: # setiap PR -> test + build saja (image tidak di-push)

# Jalankan satu per branch/PR. Run lama yang masih berjalan dibatalkan HANYA untuk
# PR (supaya PR cepat). Push ke main tidak pernah dibatalkan agar deploy yang sedang
# berjalan tidak terputus di tengah jalan.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # JOB 1/3 - TEST
  # Pastikan kode sehat (lint, tipe, test lulus) sebelum di-build/di-deploy.
  # ===========================================================================
  test:
    name: "Job 1/3: Test"
    runs-on: ubuntu-latest # runner resmi GitHub (Linux, gratis 2000 menit/bulan)
    timeout-minutes: 20 # batas waktu job, mencegut run menggantung selamanya
    permissions:
      contents: read # job ini hanya boleh membaca kode

    # Database MySQL untuk `composer setup` (langkah migrate).
    # Kredensial harus sama dengan .env.example (root/example, db dfiber)
    # karena setup menyalin .env.example -> .env di runner.
    # health-cmd membuat runner menunggu MySQL siap sebelum step pertama jalan.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: example
          MYSQL_ROOT_HOST: "%" # izinkan koneksi dari runner (bukan hanya localhost container)
          MYSQL_DATABASE: dfiber
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Ambil kode repository ke runner.
      # persist-credentials: false -> token GitHub tidak disimpan di disk runner
      # (langkah keamanan standar, mencegah token bocor lewat script build).
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pasang PHP 8.5 + Composer v2 di runner.
      # Harus sama dengan versi di Dockerfile (8.5.x) karena composer.lock
      # dikunci untuk paket yang butuh PHP >= 8.4.1 (symfony 8.1, pest 5, dll).
      # coverage: none -> tidak memasang xdebug, job jauh lebih cepat.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql # driver MySQL untuk langkah migrate di composer setup
          tools: composer:v2
          coverage: none

      # Pasang Node.js 22 untuk tool frontend (Vite, vue-tsc, npm run check).
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # composer setup (lihat composer.json) menjalankan:
      #   composer install          -> pasang dependency PHP
      #   copy .env.example -> .env  -> buat file env di runner (sekali pakai)
      #   php artisan key:generate  -> buat APP_KEY untuk runner
      #   php artisan migrate       -> terapkan migrasi database ke DB sementara CI
      #   npm install + npm run build -> pasang dependency JS & build aset Vite
      - name: Setup Application
        run: composer setup

      # composer ci:check (lihat composer.json) menjalankan:
      #   npm run check        -> lint/format kode frontend (vite-plus)
      #   npm run types:check  -> type-check TypeScript (vue-tsc --noEmit)
      #   pint --parallel --test -> cek format kode PHP (tanpa mengubah file)
      #   phpstan analyse      -> static analysis PHP (larastan)
      #   php artisan test     -> unit test Pest
      - name: Run CI Checks
        run: composer ci:check

  # ===========================================================================
  # JOB 2/3 - BUILD & PUSH IMAGE
  # Build image Docker produksi lalu simpan ke GHCR. Hanya jalan jika test lulus.
  # ===========================================================================
  build:
    name: "Job 2/3: Build image"
    needs: test # rantai: test harus lulus dulu sebelum build
    runs-on: ubuntu-latest
    timeout-minutes: 30 # build Docker pertama kali bisa lama (~10 menit)

    # Hak akses khusus job ini:
    # - contents: read  -> boleh baca kode
    # - packages: write -> BOLEH menulis (push) image ke GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Login ke GitHub Container Registry (ghcr.io) memakai token otomatis
      # GITHUB_TOKEN yang lahir per-run - tidak perlu membuat token manual.
      - name: Login ke GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io # registry Docker milik GitHub
          username: ${{ github.actor }} # pemilik repository (AdisufatulAnam)
          password: ${{ secrets.GITHUB_TOKEN }} # token otomatis, hangus setelah run selesai

      # Hitung nama & tag image otomatis dari konteks GitHub:
      #   type=ref,event=branch -> tag "main" / "dev" (sesuai nama branch)
      #   type=sha             -> tag "sha-<commit>" (dipakai untuk rollback)
      #   type=raw latest      -> tag "latest", HANYA di default branch (main)
      # Contoh hasil: ghcr.io/adisufatulanam/d-fiber:main
      - name: Hitung metadata image
        id: meta # id ini dipakai di bawah (steps.meta.outputs.*) dan di job deploy
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }} # nama image = ghcr.io/<owner>/<repo>
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build image dari Dockerfile (composer install --no-dev, npm ci, npm run build).
      # - push: true hanya untuk event push; di PR cukup build untuk membuktikan
      #   Dockerfile tidak rusak (image tidak diunggah).
      # - cache gha memakai cache bawaan GitHub Actions agar build berikutnya cepat
      #   (layer composer/npm tidak diulang dari nol).
      - name: Build dan push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # konteks build = root repository (tempat Dockerfile)
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # baca cache dari GitHub Actions
          cache-to: type=gha,mode=max # tulis semua layer ke cache (bukan hanya final)

    # Output job ini dipakai job deploy untuk tahu image mana yang harus di-pull.
    outputs:
      image: ${{ steps.meta.outputs.image }} # contoh: ghcr.io/adisufatulanam/d-fiber
      tag: ${{ steps.meta.outputs.version }} # contoh: main

  # ===========================================================================
  # JOB 3/3 - DEPLOY KE SERVER HOME
  # SSH ke server home lewat Tailscale (server tidak butuh IP publik).
  # ===========================================================================
  deploy:
    name: "Job 3/3: Deploy"
    needs: build # rantai: test -> build -> deploy (test wajib lulus dulu)
    # Hanya deploy saat push ke main. PR dan push ke dev TIDAK deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # Checkout diperlukan agar file docker-compose.prod.yml tersedia
      # untuk di-upload (scp) ke server di langkah berikutnya.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Aktifkan Tailscale di runner: runner "masuk" ke VPN rumah sehingga bisa
      # menjangkau server home yang berada di belakang NAT (tanpa IP publik).
      # - authkey : kunci otomatisasi dari admin Tailscale (secret TS_AUTHKEY)
      # - ping    : verifikasi dulu bahwa server home benar-benar online di tailnet;
      #             kalau mati, job gagal di sini dengan pesan jelas (bukan timeout SSH)
      - name: Hubungkan runner ke Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          ping: ${{ secrets.DEPLOY_HOST }}

      # Simpan private key deploy ke runner lalu salin docker-compose.prod.yml
      # ke server via SCP. Dengan ini server TIDAK perlu menyimpan kredensial git
      # sama sekali - file compose selalu tersinkron dari repository.
      - name: Upload docker-compose.prod.yml ke server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }} # isi private key (multiline)
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }} # IP Tailscale server, mis. 100.64.0.1
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }} # username SSH di server
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }} # direktori deploy, mis. /home/ho/dfiber
        run: |
          # 1. Simpan private key ke file tersembunyi dengan permission ketat
          #    (600 = hanya pemilik yang boleh membaca; OpenSSH menolak key lebih longgar)
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 700 "$HOME/.ssh"
          chmod 600 "$HOME/.ssh/id_ed25519"

          # 2. Salin file compose produksi ke server.
          #    StrictHostKeyChecking=accept-new -> terima host key pertama kali
          #    tanpa error interaktif (aman karena kita sudah lewat Tailscale).
          scp -i "$HOME/.ssh/id_ed25519" -o StrictHostKeyChecking=accept-new \
            docker-compose.prod.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

      # Jalankan script deploy di server home lewat SSH (jalur Tailscale).
      # envs = daftar nama variabel di atas yang diteruskan ke script remote.
      - name: Jalankan deploy di server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DOCKER_IMAGE: ${{ needs.build.outputs.image }} # contoh: ghcr.io/adisufatulanam/d-fiber
          DOCKER_IMAGE_TAG: ${{ needs.build.outputs.tag }} # contoh: main
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }} # IP Tailscale server home
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 30s # batas waktu koneksi SSH
          command_timeout: 10m # batas waktu eksekusi script di server
          envs: DOCKER_IMAGE,DOCKER_IMAGE_TAG,DEPLOY_PATH
          script: |
            # set -e  : langsung berhenti kalau ada perintah yang gagal
            # set -u  : error kalau ada variabel kosong/tidak didefinisikan
            # pipefail: error kalau bagian kiri pipe yang gagal
            set -euo pipefail

            # Masuk ke direktori deploy (berisi docker-compose.prod.yml + .env)
            cd "$DEPLOY_PATH"

            echo "==> [1/6] Tarik image ${DOCKER_IMAGE}:${DOCKER_IMAGE_TAG} dari GHCR"
            # docker compose pull menarik image sesuai variabel DOCKER_IMAGE/TAG
            # (dibaca dari env di atas, menimpa nilai di .env server)
            docker compose -f docker-compose.prod.yml pull

            echo "==> [2/6] Jalankan ulang container dengan image baru"
            # up -d membuat ulang container yang image-nya berubah (tanpa downtime
            # panjang); --remove-orphans membuang container sisa compose lama
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> [3/6] Jalankan migrasi database"
            # exec -T = masuk ke container app tanpa TTY (wajib di CI),
            # --force = wajibkan migrasi walau APP_ENV=production
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

            echo "==> [4/6] Cache konfigurasi & route"
            # optimize = config:cache + route:cache -> response aplikasi lebih cepat
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize

            echo "==> [5/6] Smoke test: buka halaman utama dari dalam container"
            # Coba akses http://localhost/ (route "/") maksimal 10x dengan jeda 2 detik
            # (nginx/php-fpm mungkin butuh waktu beberapa detik setelah container baru)
            smoke_ok=""
            for i in $(seq 1 10); do
              if docker compose -f docker-compose.prod.yml exec -T app curl -fsS -o /dev/null http://localhost/; then
                smoke_ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$smoke_ok" ]; then
              echo "Smoke test GAGAL: aplikasi tidak merespons"
              docker compose -f docker-compose.prod.yml logs --tail=50 app
              exit 1
            fi
            echo "      OK - aplikasi merespons 200"

            echo "==> [6/6] Status container + bersihkan image lama"
            # ps = tampilkan status container (running/exit) untuk log GitHub
            docker compose -f docker-compose.prod.yml ps
            # image prune -f = buang image dangling (image lama yang sudah tidak
            # punya tag setelah diganti) agar disk server tidak membengkak.
            # Image ber-tag sha-xxx TIDAK dihapus (dipakai untuk rollback).
            docker image prune -f

  notify:
    name: "Notifikasi Discord"
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Notifikasi Discord
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WEBHOOK_URL tidak diset, lewati notifikasi."
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$DEPLOY_RESULT" = "success" ]; then
            EMOJI="🚀"
            STATUS="SUCCESS"
            COLOR=3066993
            FOOTER="🎉 Application successfully deployed!"
          else
            EMOJI="💥"
            STATUS="FAILED"
            COLOR=15158332
            FOOTER="❌ Deployment failed. Check GitHub Actions logs!"
          fi

          FMT_TEST=$( [ "$TEST_RESULT" = "success" ] && echo "SUCCESS" || echo "FAILED" )
          FMT_BUILD=$( [ "$BUILD_RESULT" = "success" ] && echo "SUCCESS" || ( [ "$BUILD_RESULT" = "skipped" ] && echo "SKIPPED" || echo "FAILED" ) )
          FMT_DEPLOY=$( [ "$DEPLOY_RESULT" = "success" ] && echo "SUCCESS" || ( [ "$DEPLOY_RESULT" = "skipped" ] && echo "SKIPPED" || echo "FAILED" ) )

          PAYLOAD=$(jq -n \
            --arg title "${EMOJI} CI/CD DEPLOYMENT ${STATUS}" \
            --arg repo "${{ github.repository }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg author "${{ github.actor }}" \
            --arg commit "${{ github.sha }}" \
            --arg test "$FMT_TEST" \
            --arg build "$FMT_BUILD" \
            --arg deploy "$FMT_DEPLOY" \
            --arg footer "$FOOTER" \
            --argjson color "$COLOR" \
            '{
              embeds: [{
                title: $title,
                description: ("```\n📦 Project : dfiber-app\n🌿 Branch  : " + $branch + "\n👤 Author  : " + $author + "\n🔖 Commit  : " + $commit + "\n\n📋 PIPELINE RESULTS\n━━━━━━━━━━━━━━━━━━━━\nTest Check    : " + $test + "\nDocker Build  : " + $build + "\nSSH Deploy    : " + $deploy + "\n━━━━━━━━━━━━━━━━━━━━\n\n" + $footer + "\n```\n🔗 GitHub Actions:\nhttps://github.com/" + $repo + "/actions/runs/" + $run_id),
                color: $color
              }]
            }')

          curl -s -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "${WEBHOOK_URL}"

