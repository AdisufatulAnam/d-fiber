services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${DOCKER_APP_CONTAINER:-dfiber-app}
    restart: unless-stopped
    ports:
      - "${DOCKER_HTTP_PORT:-8000}:80"
      - "${DOCKER_VITE_PORT:-5174}:5174"
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
      - /var/www/html/node_modules
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      # Koneksi database (dari .env). Default host.docker.internal bila DB_HOST tidak di-set.
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-dfiber}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - PAIL_DISABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dfiber-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${DOCKER_QUEUE_CONTAINER:-dfiber-queue}
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=5 --timeout=120
    volumes:
      - .:/var/www/html
      - ./.env:/var/www/html/.env
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-dfiber}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - PAIL_DISABLED=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dfiber-network

networks:
  dfiber-network:
    name: ${DOCKER_NETWORK_NAME:-dfiber-network}
    driver: bridge
